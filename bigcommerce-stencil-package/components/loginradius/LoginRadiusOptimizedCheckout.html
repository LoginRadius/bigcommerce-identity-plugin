{{#unless customer}}
<style>
	.lr-checkout-signin {
		margin: 0 0 1.5rem;
		padding: 1rem 1.25rem;
		border: 1px solid #d9d9d9;
		border-radius: 4px;
		background: #f7f7f7;
		font-size: 0.9rem;
	}
	.lr-checkout-signin a {
		font-weight: 600;
		text-decoration: underline;
	}
</style>
<script>
	(function () {
		var LOGIN_PATH = '/login.php';
		var CHECKOUT_APP_SELECTOR = '#checkout-app';
		var PROMPT_ID = 'lr-checkout-signin';
		var OBSERVE_TIMEOUT_MS = 15000;

		function buildLoginUrl() {
			return LOGIN_PATH + '?return_url=' + encodeURIComponent(window.location.href);
		}

		function injectPrompt(appEl) {
			if (document.getElementById(PROMPT_ID)) {
				return;
			}
			var wrap = document.createElement('div');
			wrap.id = PROMPT_ID;
			wrap.className = 'lr-checkout-signin';

			var label = document.createTextNode('Already have an account? ');
			var link = document.createElement('a');
			link.href = buildLoginUrl();
			link.textContent = 'Sign in to your account';

			wrap.appendChild(label);
			wrap.appendChild(link);

			// Insert as a sibling *before* the React checkout root so it is not
			// managed (and wiped) by the checkout app's re-renders.
			appEl.parentNode.insertBefore(wrap, appEl);
		}

		function tryInject() {
			var appEl = document.querySelector(CHECKOUT_APP_SELECTOR);
			if (appEl) {
				injectPrompt(appEl);
				return true;
			}
			return false;
		}

		function init() {
			if (tryInject()) {
				return;
			}
			// The checkout app mounts asynchronously; watch for it to appear.
			var observer = new MutationObserver(function () {
				if (tryInject()) {
					observer.disconnect();
				}
			});
			observer.observe(document.documentElement, { childList: true, subtree: true });
			setTimeout(function () {
				observer.disconnect();
			}, OBSERVE_TIMEOUT_MS);
		}

		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', init);
		} else {
			init();
		}
	})();
</script>
{{/unless}}
