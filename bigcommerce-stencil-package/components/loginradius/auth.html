
<style>
	.login .page-heading { margin-bottom: 0.75rem; }
</style>
<div id="authcontainer" style="display:none;max-width:480px;width:100%;margin:0 auto 2rem;">
	<div id="lr-message-container" class="lr-popup-message"
		 style="display:none;margin:1rem 0;padding:0.75rem 1rem;border:1px solid #d9d9d9;border-radius:4px;background:#f7f7f7;"></div>
	<div id="lr-auth-container"></div>
	<div id="lr-verify-container"></div>
</div>
<script>
	(function () {
		var attempts = 0;
		function lrInitAuth() {

			if (typeof LoginRadiusBCUX === 'undefined' || typeof LRObject === 'undefined') {
				if (attempts++ < 100) {
					return window.setTimeout(lrInitAuth, 50);
				}
				if (window.console) {
					console.error('LoginRadius: interface/SDK failed to load; check LRreferences include.');
				}
				return;
			}
			LoginRadiusBCUX.interface.DisplayAuth();
		}
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', lrInitAuth);
		} else {
			lrInitAuth();
		}
	})();
</script>
