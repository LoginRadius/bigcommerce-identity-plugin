<script>
	(function () {
		if (typeof enableSSO === 'undefined' || !enableSSO) {
			return;
		}

		var apiKey = (typeof option !== 'undefined' && option) ? option.apiKey : '';
		var tenant = (typeof ssoTenantName !== 'undefined') ? ssoTenantName : '';
		{{!-- Triple-brace (unescaped): this value is assigned into a JS string,
		      not HTML. {{ }} would HTML-escape "=" to "&#x3D;", producing the
		      broken URL /login.php?action&#x3D;logout and an auto-logout loop. --}}
		var logoutUrl = "{{{urls.auth.logout}}}";
		var isCustomerLoggedIn = {{#if customer}}true{{else}}false{{/if}};

		if (!apiKey || !tenant) {
			return;
		}

		function loginToBigCommerce(token) {
			var url = LoginRadius_Bigcommerce.util.getURL(token, apiKey, "", storeName);
			LoginRadius_Bigcommerce.util.jsonpCall(url, function (tokendata) {
				if (tokendata && tokendata.loginUrl != null) {
					LoginRadius_Bigcommerce.util.sendusertosite(tokendata.loginUrl);
				}
			});
		}


		function validateToken(token) {
			var url = "https://api.loginradius.com/identity/v2/auth/access_token/Validate?access_token=" +
				encodeURIComponent(token) + "&apikey=" + encodeURIComponent(apiKey);
			return fetch(url)
				.then(function (r) { return r.ok; })
				.catch(function () { return true; });
		}


		function getShopperToken() {
			try {
				if (typeof LRObject !== 'undefined' && LRObject && typeof LRObject.getAccessToken === 'function') {
					var live = LRObject.getAccessToken();
					if (live) {
						return live;
					}
				}
			} catch (e) { /* fall through to the persisted copy */ }
			return LoginRadius_Bigcommerce.util.getBrowserStorage("LRTokenKey");
		}

		function isSignOutLink(link) {
			var href = link.getAttribute('href') || '';
			return href.indexOf('action=logout') !== -1;
		}


		function interceptSignOut() {
			document.addEventListener('click', function (e) {
				if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
					return;
				}
				var target = e.target;
				var link = (target && target.closest) ? target.closest('a[href]') : null;
				if (!link || !isSignOutLink(link)) {
					return;
				}
				e.preventDefault();
				LoginRadiusBCUX.interface.signOut(link.href);
			}, true);
		}

		function syncSession() {
			if (isCustomerLoggedIn) {

				var ownToken = getShopperToken();
				if (!ownToken) {
					return;
				}
				validateToken(ownToken).then(function (valid) {
					if (!valid) {
						LoginRadiusBCUX.interface.signOut(logoutUrl);
					}
				});
				return;
			}

			if (typeof LRObject === 'undefined' || !LRObject || typeof LRObject.ensureSession !== 'function') {
				return;
			}
			LRObject.ensureSession().then(function () {
				var token = LRObject.getAccessToken();
				if (token) {
					loginToBigCommerce(token);
				}
			}).catch(function () {
				// No hub session, or the hub is unreachable: stay a guest.
			});
		}

		function run() {

			if (typeof LoginRadiusBCUX === 'undefined' || !LoginRadiusBCUX.interface ||
				typeof LoginRadiusBCUX.interface.signOut !== 'function') {
				return;
			}
			interceptSignOut();
			// Never restore a session on the page load a sign-out landed on.
			LoginRadiusBCUX.interface.sessionReady.then(function (signedOut) {
				if (!signedOut) {
					syncSession();
				}
			});
		}

		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', run);
		} else {
			run();
		}
	})();
</script>
