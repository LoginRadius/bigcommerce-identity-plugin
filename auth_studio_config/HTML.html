<!--
  Hosted Auth page — HTML tab
  Two-column BigCommerce "Sign in" layout:
  left column = the LoginRadius widget (#auth-container), right column = the
  "New Customer?" panel. The widget still owns everything inside #auth-container.
-->
<div class="container">
    <div class="lr-page">
      <nav class="lr-breadcrumbs" aria-label="Breadcrumb">
        <a href="/">Home</a>
        <span class="lr-breadcrumb-sep">/</span>
        <span class="lr-breadcrumb-current">Login</span>
      </nav>
  
      <h1 class="lr-page-heading">Sign in</h1>
  
      <div class="lr-login-grid">
        <div id="auth-container"></div>
  
        <aside class="lr-new-customer">
          <h2>New Customer?</h2>
          <p>Create an account with us and you'll be able to:</p>
          <ul>
            <li>Check out faster</li>
            <li>Save multiple shipping addresses</li>
            <li>Access your order history</li>
            <li>Track new orders</li>
            <li>Save items to your Wish List</li>
          </ul>
          <button type="button" class="lr-create-account">Create Account</button>
        </aside>
      </div>
    </div>
  </div>
